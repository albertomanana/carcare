<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d13" />
    <meta name="description" content="CarCare: historial, gastos, kilometraje y recordatorios de tus vehículos, y gestión de taller con órdenes y elevadores, sobre un modelo 3D." />
    <title>CarCare</title>
    <script>
      // Aplica el tema antes de pintar (evita el destello): el fijado en Ajustes o, si sigue al sol, el último que se vio
      // (sin visita previa, claro entre las 8 y las 19 h). ThemeProvider lo ajusta al sol real al arrancar.
      try {
        var t = localStorage.getItem('carcare.themeMode')
        if (t !== 'light' && t !== 'dark') t = localStorage.getItem('carcare.theme')
        if (t !== 'light' && t !== 'dark') {
          var h = new Date().getHours()
          t = h >= 8 && h < 19 ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
