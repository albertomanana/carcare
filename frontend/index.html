<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111518" />
    <meta name="description" content="CarCare: historial, gastos, kilometraje y recordatorios de tus vehículos, y gestión de taller con órdenes y elevadores, sobre un modelo 3D." />
    <title>CarCare</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita el destello de tema incorrecto)
      try {
        var t = localStorage.getItem('carcare.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
